<!doctype html><html><head><meta charset="utf-8"><title>Still brand images</title><style>body{font-family:Helvetica,Arial,sans-serif;margin:32px;background:#f4f5f7;color:#222}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.card{border-radius:14px;padding:20px;text-align:center}.small{display:flex;justify-content:center;gap:14px;align-items:center;margin:12px 0}h2{font-size:15px;margin:6px 0 4px}p{margin:0;font-size:13px;opacity:.7}</style></head><body><h1>still: brand images</h1><p>Pause pose · gold #FFC300 · teal #0FA3A3 · dark teal #064E4E · outline #111111</p><div class="grid"><div class="card" style="background:#fff;color:#222"><img src="still-app-icon.svg" width="160"><div class="small"><img src="still-app-icon.svg" width="60"><img src="still-app-icon.svg" width="29"></div><h2>App icon</h2><p>Rounded, for previews and web</p></div><div class="card" style="background:#fff;color:#222"><img src="still-app-icon-square.svg" width="160"><div class="small"><img src="still-app-icon-square.svg" width="60"><img src="still-app-icon-square.svg" width="29"></div><h2>App icon (square)</h2><p>Upload this to App Store / Google Play; they round the corners</p></div><div class="card" style="background:#fff;color:#222"><img src="still-logo.svg" width="160"><div class="small"><img src="still-logo.svg" width="60"><img src="still-logo.svg" width="29"></div><h2>Logo</h2><p>For white / light backgrounds</p></div><div class="card" style="background:#15151a;color:#eee"><img src="still-logo-on-dark.svg" width="160"><div class="small"><img src="still-logo-on-dark.svg" width="60"><img src="still-logo-on-dark.svg" width="29"></div><h2>Logo on dark</h2><p>For dark backgrounds</p></div></div></body></html>
